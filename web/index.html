<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ritual Pods — Fremont</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
  </div>

  <main class="wrap">
    <header>
      <p class="kicker">A weekly ritual, not another app to check</p>
      <h1>Ritual Pods</h1>
      <p class="tagline" id="tagline">Pick a weekly ritual in your neighborhood. We'll form your pod once enough people are in.</p>
    </header>

    <section id="signin-view" hidden>
      <form id="signin-form">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
        <button type="submit">Get a sign-in link</button>
      </form>
      <p id="signin-status" class="status" role="status"></p>
    </section>

    <section id="app-view" hidden>
      <p id="signed-in-as" class="status"></p>
      <ul id="ritual-list" class="ritual-list"></ul>
      <p id="empty-state" class="status" hidden>No rituals set up for this neighborhood yet.</p>
    </section>
  </main>

  <script type="module" src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
